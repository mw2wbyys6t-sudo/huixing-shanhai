# 部署前端（frontend/ 静态导出）到 GitHub Pages
# 站点地址：https://mw2wbyys6t-sudo.github.io/huixing-shanhai/
# 前提：仓库 Settings → Pages → Source 选择 "GitHub Actions"
name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build（Pages 子路径 + 线上后端）
        working-directory: frontend
        env:
          NEXT_PUBLIC_BASE_PATH: /huixing-shanhai
          NEXT_PUBLIC_API_URL: https://huixing-shanhai.onrender.com
          NEXT_PUBLIC_SITE_URL: https://mw2wbyys6t-sudo.github.io/huixing-shanhai
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
