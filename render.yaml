# Render Blueprint：一键创建后端 API + 前端静态站
# 使用方法：Render 控制台 → New → Blueprint → 选择本仓库 → Apply
# 服务 URL 即：https://huixing-shanhai-api.onrender.com / https://huixing-shanhai-web.onrender.com
# （若名称被占用 Render 会加随机后缀，部署后以控制台显示的地址为准）
services:
  - type: web
    name: huixing-shanhai-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: DEEPSEEK_API_KEY
        sync: false        # 部署时在界面填入（backend/.env 里有）
      - key: AMAP_KEY
        sync: false        # 「Web服务」类型 Key（backend/.env 里有）
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://huixing-shanhai-web.onrender.com

  - type: static
    name: huixing-shanhai-web
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: "20.11.1"
      - key: NEXT_PUBLIC_API_URL
        value: https://huixing-shanhai-api.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://huixing-shanhai-web.onrender.com
      - key: NEXT_PUBLIC_BASE_PATH
        value: ""
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
